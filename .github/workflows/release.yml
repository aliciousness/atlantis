name: Release Atlantis

on:
  push:
    branches: [main]
    paths: [dockerfile, CHANGELOG.md]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a #7.0.1
        with:
          fetch-depth: 2
      
      - name: Check both files modified
        id: check_files
        run: |
          # Get list of files modified in the push
          MODIFIED_FILES=$(git diff --name-only HEAD^..HEAD)
          echo "Modified files: $MODIFIED_FILES"
          
          # Check if both dockerfile AND CHANGELOG.md were modified
          if echo "$MODIFIED_FILES" | grep -q "^dockerfile$" && echo "$MODIFIED_FILES" | grep -q "^CHANGELOG.md$"; then
            echo "both_modified=true" >> "$GITHUB_OUTPUT"
            echo "✅ Both dockerfile and CHANGELOG.md were modified"
          else
            echo "both_modified=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Both files must be modified together. Skipping release."
          fi
      
      - name: Extract version from dockerfile
        if: steps.check_files.outputs.both_modified == 'true'
        id: version
        run: |
          VERSION=$(grep -oP 'FROM ghcr.io/runatlantis/atlantis:\Kv[^\s-]+' dockerfile)
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if release already exists
        if: steps.check_files.outputs.both_modified == 'true'
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream release notes
        if: steps.check_files.outputs.both_modified == 'true' && steps.check_release.outputs.exists == 'false'
        id: upstream_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          UPSTREAM_BODY=$(gh api "repos/runatlantis/atlantis/releases/tags/${TAG}" --jq '.body // ""' 2>/dev/null || echo "")
          UPSTREAM_URL="https://github.com/runatlantis/atlantis/releases/tag/${TAG}"

          {
            echo "body<<RELEASE_EOF"
            echo "## Atlantis ${TAG}"
            echo ""
            echo "Automated release tracking [runatlantis/atlantis ${TAG}](${UPSTREAM_URL})."
            echo ""
            echo "### Upstream Changes"
            echo ""
            if [ -n "$UPSTREAM_BODY" ]; then
              echo "$UPSTREAM_BODY"
            else
              echo "See [upstream release notes](${UPSTREAM_URL})."
            fi
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check_files.outputs.both_modified == 'true' && steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          UPSTREAM_BODY="${{ steps.upstream_notes.outputs.body }}"

          # Construct combined body with upstream notes and separator for auto-generated section
          COMBINED_BODY="${UPSTREAM_BODY}

          ### What's Changed in This Image
          "

          # Create release via GitHub API with generate_release_notes to append auto-generated notes
          gh api repos/aliciousness/atlantis/releases \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f body="$COMBINED_BODY" \
            -F generate_release_notes=true

      - name: Set up QEMU
        if: steps.check_files.outputs.both_modified == 'true' && steps.check_release.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: steps.check_files.outputs.both_modified == 'true' && steps.check_release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          use: true

      - name: Login to DockerHub
        if: steps.check_files.outputs.both_modified == 'true' && steps.check_release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app
        if: steps.check_files.outputs.both_modified == 'true' && steps.check_release.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            "aliciousness/atlantis:${{ steps.version.outputs.tag }}"
            "aliciousness/atlantis:latest"
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          labels: |
            maintainer="craddock9richard@gmail.com"
            org.opencontainers.image.authors="craddock9richard@gmail.com"

  trigger-badges:
    needs: release
    uses: ./.github/workflows/badges.yml
    permissions:
      contents: write
      id-token: write
    secrets: inherit

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, builds an image, performs a container image
# vulnerability scan with Anchore's Grype tool, and integrates the results with GitHub Advanced Security
# code scanning feature.  For more information on the Anchore scan action usage
# and parameters, see https://github.com/anchore/scan-action. For more
# information on Anchore's container image scanning tool Grype, see
# https://github.com/anchore/grype
name: Anchore Grype vulnerability scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '28 6 * * 6'

permissions:
  contents: read

jobs:
  Anchore-Build-Scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
    - name: Check out the code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a #7.0.1
    - name: build local container
      uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28 #7.3.0
      with:
        tags: localbuild/testimage:latest
        push: false
        load: true
    - name: Run the Anchore Grype scan action
      uses: anchore/scan-action@ac02c2cca96bd43004ad85e5fc951721f0a623ea #v7.4.0
      id: scan
      with:
        image: "localbuild/testimage:latest"
        fail-build: false
        # severity-cutoff: critical
        only-fixed: true
    - name: Upload vulnerability report
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 #v4.37.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
